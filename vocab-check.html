<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vocab Check</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Vérification du vocabulaire</h1>
    <p class="subtitle">Every word the game uses, straight from <code>js/vocab.js</code>.
      Rows with an orange bar need a human to double-check them.</p>

    <div class="panel filters">
      <label for="category">Catégorie :</label>
      <select id="category">
        <option value="all">Toutes</option>
      </select>
      <label><input type="checkbox" id="only-verify"> Only show words to verify</label>
      <span class="stats" id="stats"></span>
    </div>

    <div class="panel table-wrap">
      <table>
        <thead>
          <tr><th>Image</th><th>Français</th><th>Genre</th><th>English</th><th>Catégorie</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>

    <p><a class="button secondary" href="index.html">← Retour</a></p>
  </main>

  <script src="js/vocab.js"></script>
  <script>
    const categorySelect = document.getElementById("category");
    const onlyVerifyBox = document.getElementById("only-verify");
    const rowsBody = document.getElementById("rows");
    const stats = document.getElementById("stats");

    // Fill the category dropdown.
    for (const [key, name] of Object.entries(CATEGORY_NAMES)) {
      const option = document.createElement("option");
      option.value = key;
      option.textContent = name;
      categorySelect.appendChild(option);
    }

    function genderLabel(word) {
      if (!word.gender) return "—";
      const g = word.gender === "m" ? "masc." : "fém.";
      return word.plural ? g + " pl." : g;
    }

    // Rebuild the table using the current filters.
    function showRows() {
      const category = categorySelect.value;
      const words = VOCAB.filter((word) =>
        (category === "all" || word.categories.includes(category)) &&
        (!onlyVerifyBox.checked || word.verify)
      );

      rowsBody.innerHTML = "";
      for (const word of words) {
        const row = document.createElement("tr");
        if (word.verify) row.className = "needs-check";

        const cells = [
          word.emoji || "pas d’image",
          withArticle(word),
          genderLabel(word),
          word.en,
          word.categories.map((c) => CATEGORY_NAMES[c]).join(", "),
        ];
        cells.forEach((text, i) => {
          const cell = document.createElement("td");
          cell.textContent = text;
          if (i === 0) cell.className = word.emoji ? "emoji" : "none";
          row.appendChild(cell);
        });

        // Put the "please verify" note under the French word.
        if (word.verify) {
          const note = document.createElement("div");
          note.className = "verify-note";
          note.textContent = "⚠ " + word.verify;
          row.children[1].appendChild(note);
        }
        rowsBody.appendChild(row);
      }

      const toVerify = words.filter((w) => w.verify).length;
      stats.textContent = words.length + " mots · " + toVerify + " à vérifier";
    }

    categorySelect.addEventListener("change", showRows);
    onlyVerifyBox.addEventListener("change", showRows);
    showRows();
  </script>
</body>
</html>
